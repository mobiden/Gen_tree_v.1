{% extends 'main.html' %}
{% load static %}

{% block title %}Изменить данные{% endblock %}
{% block main_body %}
            <form method="post" enctype="multipart/form-data" action="{% url 'change_person' pk=object.id %}" class="app-card app-card--narrow">
            {% csrf_token %}
            <h1 class="app-title">Изменить данные</h1>
                <p class="app-subtitle">Проверьте данные человека и сохраните изменения.</p>
                {{ form.as_ul}}
            <input id="form-submit" type="submit" value="Изменить">
                {% if success %}
                    <p class="h3 mt-3">{{ success }}</p>
                {% endif %}

            </form>
{% endblock %}
