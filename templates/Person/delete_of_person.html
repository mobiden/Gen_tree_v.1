{% extends 'main.html' %}
{% load static %}
{% block title %}Удалить человека{% endblock %}





{% block main_body %}
            <form method="post" enctype="multipart/form-data" action="{% url 'delete_person' pk=object.id %}" class="app-card app-card--narrow">
            {% csrf_token %}
            <h1 class="app-title">Удалить человека</h1>
                <p class="app-subtitle">Это действие нельзя отменить.</p>
                <div class="empty-state mb-3">Вы уверены, что хотите удалить: <strong>{{ object }}</strong>?</div>
                <input type="submit" value="Удалить">

            </form>

{% endblock %}
