{% load static %}

<div class="photo_item">
    <a href="{% url 'photo_detailed'  pk=photo.id %}">
    {% if photo.the_photo %}
            <img src="{{photo.the_photo.url}}" class="app-photo-thumb" alt="фото">
        {% endif %}
        {% if photo.comments %}
            <p>{{ photo.comments }}</p>
        {% else %}
            <p>Без комментария</p>
        {% endif %}
    </a>


</div>
