{% extends 'main.html' %}
{% load static %}
{% block title %}Фото{% endblock %}


{% block main_body %}
            <div class="app-card">
            <h1 class="app-title">Архивные фотографии</h1>

            {% csrf_token %}
            <div class="container-fluid px-0">
                     <div class="row g-3">

                       {% for photo in object_list %}
                {% if photo.the_photo %}
                        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
                            {% include 'Photo/photo_item.html' %}
                        </div>
                {% endif %}

                       {% empty %}
                        <div class="empty-state">Нет фото</div>
                       {% endfor %}

                     </div>
                </div>
            </div>

{% endblock %}
